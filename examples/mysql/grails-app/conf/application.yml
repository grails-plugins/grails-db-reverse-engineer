---
info:
   app:
      name: '@info.app.name@'
      version: '@info.app.version@'
      grailsVersion: '@info.app.grailsVersion@'
spring:
   freemarker:
      checkTemplateLocation: false
   groovy:
      template:
         check-template-location: false
---
grails:
   views:
      default:
         codec: html
      gsp:
         encoding: UTF-8
         htmlcodec: xml
         codecs:
            expression: html
            scriptlet: html
            taglib: none
            staticparts: none
   mime:
      disable:
         accept:
            header:
               userAgents:
                  - Gecko
                  - WebKit
                  - Presto
                  - Trident
      types:
         all: '*/*'
         atom: application/atom+xml
         css: text/css
         csv: text/csv
         form: application/x-www-form-urlencoded
         html:
            - text/html
            - application/xhtml+xml
         js: text/javascript
         json:
            - application/json
            - text/json
         multipartForm: multipart/form-data
         pdf: application/pdf
         rss: application/rss+xml
         text: text/plain
         hal:
            - application/hal+json
            - application/hal+xml
         xml:
            - text/xml
            - application/xml
   codegen:
      defaultPackage: com.example.reveng.test
   profile: web
---
hibernate:
   cache:
      queries: false
      use_query_cache: false
      use_second_level_cache: false
   format_sql: true
   use_sql_comments: true
grails:
   # do not reload since we'll be generating domain objects
   run:
      active: false
   plugin:
      reveng:
         packageName: 'com.example.reveng.test'
         versionColumns:
            other: 'nonstandard_version_name'
         manyToManyTables:
            - user_role
         manyToManyBelongsTos:
            user_role: role
            author_books: book
dataSource:
   driverClassName: com.mysql.cj.jdbc.Driver
   username: reveng
   password: reveng
   pooled: true
   jmxExport: true
   dbCreate: none
   url: jdbc:mysql://localhost:3306/reveng
